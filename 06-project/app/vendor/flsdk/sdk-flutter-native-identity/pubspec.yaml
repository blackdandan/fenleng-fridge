name: fenleng_sdk_flutter_native_identity
description: Optional native identity providers for Fenleng Flutter clients.
version: 0.2.0
homepage: https://github.com/blackdandan/fenleng-client-sdk

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.fenleng.sdk.nativeidentity
        pluginClass: FenlengNativeIdentityPlugin
      ios:
        pluginClass: FenlengNativeIdentityPlugin
      ohos:
        pluginClass: FenlengNativeIdentityPlugin
